<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant POS System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Auth Modal -->
    <div id="authModal" class="modal active">
        <div class="modal-content">
            <h2>POS System Login</h2>
            <p>Connect to Google Drive to sync your data</p>
            <button id="signInButton" class="btn btn-primary">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
            <div id="authStatus" class="auth-status"></div>
            <div id="debugInfo" style="margin-top: 20px; font-size: 12px; color: #666;"></div>
        </div>
    </div>

    <!-- Main App (hidden until authenticated) -->
    <div id="appContainer" class="app-container" style="display: none;">
        <!-- ... rest of your app container ... -->
    </div>

    <!-- Load Google APIs -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    
    <!-- Load our scripts -->
    <script src="auth.js"></script>
    <script src="drive-sync.js"></script>
    <script src="data-manager.js"></script>
    <script src="app.js"></script>
    
    <!-- Initialize debug -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            document.getElementById('debugInfo').innerHTML = 
                'Scripts loaded. Check console for details.';
        });
    </script>
</body>
</html>
